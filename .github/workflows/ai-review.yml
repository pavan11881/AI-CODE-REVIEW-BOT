name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger AI Code Review Bot
        env:
          AI_REVIEW_BOT_URL: ${{ secrets.AI_REVIEW_BOT_URL }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "AI Code Review triggered"
          echo "Repository: $REPO"
          echo "Pull Request: $PR_NUMBER"

          if [ -z "$AI_REVIEW_BOT_URL" ]; then
            echo "ERROR: AI_REVIEW_BOT_URL is EMPTY"
            exit 1
          else
            echo "AI_REVIEW_BOT_URL is SET"
          fi

          curl -f -X POST \
            "$AI_REVIEW_BOT_URL/review/${REPO%/*}/${REPO#*/}/$PR_NUMBER"